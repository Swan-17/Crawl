<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pub Crawl App</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-color: #f4f4f9;
    }

    /* Tab Navigation */
    .tab-nav {
      display: flex;
      background-color: #ffffff;
      border-bottom: 1px solid #ccc;
    }

    .tab-btn {
      flex: 1;
      padding: 15px;
      border: none;
      background: none;
      font-size: 16px;
      font-weight: bold;
      color: #555;
      cursor: pointer;
      transition: background-color 0.2s, color 0.2s;
    }

    .tab-btn:hover {
      background-color: #eee;
    }

    .tab-btn.active {
      color: #1a73e8;
      border-bottom: 3px solid #1a73e8;
    }

    /* Tab Content Panels */
    .tab-content {
      display: none;
      flex: 1;
      flex-direction: column;
      position: relative;
    }

    .tab-content.active {
      display: flex;
    }

    /* Controls Bar for Create Tab */
    .controls {
      display: flex;
      gap: 10px;
      padding: 10px;
      background-color: #fff;
      border-bottom: 1px solid #ddd;
      z-index: 10;
    }

    .controls input {
      flex: 1;
      padding: 8px 12px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .action-btn {
      padding: 8px 16px;
      background-color: #1a73e8;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    .action-btn:hover {
      background-color: #1557b0;
    }

    /* Map Containers */
    .map-container {
      width: 100%;
      height: 100%;
      flex: 1;
    }
  </style>
</head>
<body>

  <!-- Navigation Tabs -->
  <div class="tab-nav">
    <button class="tab-btn active" onclick="switchTab('active-tab')">Active Crawl</button>
    <button class="tab-btn" onclick="switchTab('create-tab')">Create Crawl</button>
  </div>

  <!-- Active Crawl Tab -->
  <div id="active-tab" class="tab-content active">
    <div id="active-map" class="map-container"></div>
  </div>

  <!-- Create Crawl Tab -->
  <div id="create-tab" class="tab-content">
    <div class="controls">
      <input type="text" id="start-location-input" placeholder="Start address or select from map...">
      <button class="action-btn" onclick="useCurrentLocationForCreate()">📍 Use My Location</button>
    </div>
    <div id="create-map" class="map-container"></div>
  </div>

  <script>
    let activeMap, createMap;
    let activeUserMarker, createStartMarker;
    let geocoder;
    const defaultCenter = { lat: 51.5074, lng: -0.1278 }; // London fallback

    // Initialize Google Maps (Called by Google Maps script loader)
    function initMap() {
      geocoder = new google.maps.Geocoder();

      // 1. Initialize Active Crawl Map
      activeMap = new google.maps.Map(document.getElementById("active-map"), {
        zoom: 15,
        center: defaultCenter,
        disableDefaultUI: false,
      });

      // 2. Initialize Create Crawl Map
      createMap = new google.maps.Map(document.getElementById("create-map"), {
        zoom: 15,
        center: defaultCenter,
        disableDefaultUI: false,
      });

      // Auto-locate user on the Active Crawl map immediately on load
      trackActiveLocation();
    }

    // Helper: Browser Geolocation Wrapper
    function getUserLocation(onSuccess, onError) {
      if (!navigator.geolocation) {
        alert("Geolocation is not supported by your browser.");
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const pos = {
            lat: position.coords.latitude,
            lng: position.coords.longitude,
          };
          onSuccess(pos);
        },
        (error) => {
          console.error("Error retrieving location:", error);
          alert("Could not access your location. Please check browser permissions.");
          if (onError) onError(error);
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    // Active Crawl: Fetch current location and show marker
    function trackActiveLocation() {
      getUserLocation((pos) => {
        activeMap.setCenter(pos);
        activeMap.setZoom(16);

        if (activeUserMarker) {
          activeUserMarker.setPosition(pos);
        } else {
          // Blue pulse-style marker for current user location
          activeUserMarker = new google.maps.Marker({
            position: pos,
            map: activeMap,
            title: "Your Location",
            icon: {
              path: google.maps.SymbolPath.CIRCLE,
              scale: 8,
              fillColor: "#4285F4",
              fillOpacity: 1,
              strokeColor: "#ffffff",
              strokeWeight: 2,
            },
          });
        }
      });
    }

    // Create Crawl: Button handler to center map and fill start address
    function useCurrentLocationForCreate() {
      getUserLocation((pos) => {
        createMap.setCenter(pos);
        createMap.setZoom(16);

        // Place or move start marker
        if (createStartMarker) {
          createStartMarker.setPosition(pos);
        } else {
          createStartMarker = new google.maps.Marker({
            position: pos,
            map: createMap,
            title: "Start Location",
          });
        }

        // Reverse geocode to populate address field
        geocoder.geocode({ location: pos }, (results, status) => {
          if (status === "OK" && results[0]) {
            document.getElementById("start-location-input").value = results[0].formatted_address;
          } else {
            document.getElementById("start-location-input").value = `${pos.lat.toFixed(5)}, ${pos.lng.toFixed(5)}`;
          }
        });
      });
    }

    // Tab Switching Logic
    function switchTab(tabId) {
      document.querySelectorAll(".tab-content").forEach((el) => el.classList.remove("active"));
      document.querySelectorAll(".tab-btn").forEach((el) => el.classList.remove("active"));

      document.getElementById(tabId).classList.add("active");
      event.currentTarget.classList.add("active");

      // Trigger map resize recalculation so Google Maps renders properly after being unhidden
      setTimeout(() => {
        if (tabId === "active-tab" && activeMap) {
          google.maps.event.trigger(activeMap, "resize");
          trackActiveLocation();
        } else if (tabId === "create-tab" && createMap) {
          google.maps.event.trigger(createMap, "resize");
        }
      }, 100);
    }
  </script>

  <!-- Google Maps API Script -->
  <script 
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBdwemUf93q4DVGYGeAhXG39zRj3r8x0n0&callback=initMap" 
    async 
    defer>
  </script>
</body>
</html>
